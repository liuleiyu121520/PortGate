# electron-builder 完整配置（阶段 6 / m-07 未签名口径）
# better-sqlite3@13 为包内 N-API 通用预编译二进制（方案 §3.4）：无 rebuild 环节，
# 仅需保证 .node / prebuilds 在 asar 外可被 require。
appId: com.portgate.app
productName: PortGate
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
npmRebuild: false
asarUnpack:
  - "**/*.node"
  - "**/prebuilds/**"
  - "node_modules/better-sqlite3/**"
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: build/icon.png
  # m-07：固定未签名口径——有/无证书机器状态均不被自动签名（R-7/R-8，V1 不签名不公证）
  identity: null
  # 本地/CI 侧再辅以 CSC_IDENTITY_AUTO_DISCOVERY=false（CI workflow 与 README 打包命令）
win:
  target:
    - nsis
  icon: build/icon.png
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icon.png
