# PortGate CI（方案 §7 阶段 6 / AC-15）：三平台矩阵
# 流水线：npm ci → test → typecheck → lint → build → electron-builder 出对应平台产物并上传。
# 不涉及签名与公证（R-07/R-08）：CSC_IDENTITY_AUTO_DISCOVERY=false + mac identity: null（m-07）。
name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (electron-vite)
        run: npm run build

      - name: Package macOS dmg
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg --publish never

      - name: Package Windows nsis
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis --publish never

      - name: Package Linux AppImage + deb
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: portgate-macos
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: portgate-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: portgate-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
